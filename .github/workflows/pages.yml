name: Test and deploy website

# Pushes run the tests. Deploying with this workflow is manual (Actions → Run workflow)
# and is only needed when Settings → Pages → Source is "GitHub Actions". With
# "Deploy from a branch", GitHub publishes the repository root, and the root
# index.html forwards visitors to website/.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine tests
        run: node tests/engine.test.js
      - name: Python tests and JS/Python parity
        run: python3 tests/test_greendc.py

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
